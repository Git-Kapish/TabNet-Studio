<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
    .accent-box { fill: #161b22; stroke: #f59e0b; stroke-width: 1.5; rx: 6px; }
    .step-bg { fill: #161b22; stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 8px; }
    .txt-primary { fill: #f0f6fc; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .txt-amber { fill: #f59e0b; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .txt-muted { fill: #8b949e; font-family: monospace; font-size: 11px; text-anchor: middle; }
    .txt-eq { fill: #f59e0b; font-family: monospace; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .arrow-muted { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#ah-muted); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="850" height="440" rx="8"/>

  <!-- Top Input -->
  <g transform="translate(325, 20)">
    <rect class="box" width="200" height="45"/>
    <text x="100" y="27" class="txt-primary">Input Features f</text>
  </g>

  <path d="M 425 65 L 425 90" class="arrow"/>

  <!-- Preprocessing -->
  <g transform="translate(300, 90)">
    <rect class="box" width="250" height="45"/>
    <text x="125" y="27" class="txt-primary">Input BN + Categorical Embeddings</text>
  </g>

  <path d="M 425 135 L 425 160" class="arrow"/>

  <!-- Decision Step Box -->
  <g transform="translate(60, 160)">
    <rect class="step-bg" width="730" height="180"/>
    <text x="20" y="25" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">DECISION STEP i  (x N_steps)</text>

    <!-- Attentive Transformer -->
    <g transform="translate(40, 50)">
      <rect class="accent-box" width="210" height="60"/>
      <text x="105" y="28" class="txt-amber">Attentive Transformer</text>
      <text x="105" y="46" class="txt-eq">Mask M[i] = sparsemax(...) (Eq. 2)</text>
    </g>

    <!-- Arrow Attentive -> Masking -->
    <path d="M 250 80 L 290 80" class="arrow"/>

    <!-- Masking Circle -->
    <circle cx="310" cy="80" r="16" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="310" y="85" class="txt-amber" font-size="14">⊙</text>
    <text x="310" y="112" class="txt-muted" font-size="9">Eq. 3</text>

    <!-- Arrow Masking -> Feature Transformer -->
    <path d="M 326 80 L 365 80" class="arrow"/>

    <!-- Feature Transformer -->
    <g transform="translate(365, 50)">
      <rect class="accent-box" width="230" height="60"/>
      <text x="115" y="28" class="txt-amber">Feature Transformer</text>
      <text x="115" y="46" class="txt-eq">GLU + √0.5 Residuals (Eq. 6)</text>
    </g>

    <!-- Prior Scale Update (Below) -->
    <g transform="translate(40, 125)">
      <rect class="box" width="310" height="40"/>
      <text x="155" y="24" class="txt-muted">Prior Scale P[i] = P[i-1] ⊙ (γ − M[i]) (Eq. 5)</text>
    </g>

    <!-- Split Arrow from Feature Transformer -->
    <path d="M 595 80 L 650 80" class="arrow"/>
    <text x="620" y="72" class="txt-muted" font-size="9">d[i]</text>
  </g>

  <path d="M 425 340 L 425 365" class="arrow"/>

  <!-- Aggregation & Logits -->
  <g transform="translate(250, 365)">
    <rect class="accent-box" width="350" height="50"/>
    <text x="175" y="24" class="txt-amber">Decision Aggregation &amp; Final Mapping</text>
    <text x="175" y="41" class="txt-eq">d_out = ∑ ReLU(d[i]) (Eq. 7) ──► W · d_out ──► Logits</text>
  </g>
</svg>
